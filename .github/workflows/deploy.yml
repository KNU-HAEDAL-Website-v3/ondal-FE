# Cloudflare Pages 배포 (Direct Upload 방식)
#
# 왜 이 방식인가:
#   Cloudflare가 레포를 읽어가는 Git 연동은 org에 GitHub App 설치(owner 승인)가 필요하다.
#   대신 이 워크플로가 빌드해서 wrangler로 Cloudflare에 밀어 넣으면 레포 시크릿 2개만으로 동작한다.
#
# 동작:
#   - main push          → https://haedal-online-judge-fe.pages.dev - 실 BE(ondal-api) + 홈페이지(Keycloak) 로그인 빌드(.env.production).
#                          ※ 사용자 진입 주소(https://ondal.haedal-sos-man-in-the-mirror.com)는 이 워크플로가 아니라 Cloudflare Worker `ondal-fe`
#                            (Git 연동 Workers Builds - main push 마다 `npm run build` 후 정적 자산 배포)가 서빙한다. README "배포" 절
#   - PR(같은 레포 브랜치) → 미리보기 https://<브랜치명>.haedal-online-judge-fe.pages.dev + PR 코멘트 - mock(MSW) 빌드
#
# 필요한 레포 시크릿: CLOUDFLARE_API_TOKEN (Account · Cloudflare Pages · Edit), CLOUDFLARE_ACCOUNT_ID

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write     # gitHubToken으로 GitHub Deployments 기록(PR의 "View deployment" 버튼)
  pull-requests: write   # PR에 미리보기 URL 코멘트

# 같은 브랜치에 연달아 push하면 이전 실행은 취소하고 최신만 배포
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: haedal-online-judge-fe   # Pages 프로젝트명 = URL 서브도메인 (소문자만 허용)
  HOJ_PROJECT_NAME: haedal-hoj-fe        # HOJ 앱용 별도 Pages 프로젝트 - 커스텀 도메인 hoj.… 를 여기에 붙인다

jobs:
  deploy:
    # fork에서 온 PR은 시크릿이 없어 배포 불가 → 건너뜀 (팀은 같은 레포 브랜치로 작업)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR에서는 기본 checkout이 임시 merge 커밋이라 wrangler가 커밋 메시지를 못 읽음(fatal: bad object) → 브랜치 HEAD를 직접 체크아웃
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # PR 미리보기: mock(MSW) 빌드 - process env 가 .env.production 보다 우선한다
      #   - 미리보기 오리진(*.pages.dev)은 BE 의 CORS·세션 쿠키(lax) 대상이 아니라 실 BE 에 붙을 수 없다
      #   - MSW 는 같은 origin 의 /api/* 만 가로채므로 BASE_URL 을 비워야 한다(.env.production 의 실 BE 주소 무효화). mock 이면 로그인 모드도 stub 고정(api/auth.ts)
      - if: github.event_name == 'pull_request'
        run: npm run build   # tsc -b && vite build → dist/
        env:
          VITE_API_MOCK: 'true'
          VITE_API_BASE_URL: ''
      # main(프로덕션): 값은 .env.production (실 BE ondal-api + 홈페이지 로그인 oidc) - Workers Builds(ondal-fe)와 같은 단일 출처
      - if: github.event_name == 'push'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # 프로젝트가 아직 없으면 생성 (최초 1회만 실제로 실행됨)
          preCommands: |
            wrangler pages project list | grep -q "${{ env.PROJECT_NAME }}" || npx wrangler pages project create "${{ env.PROJECT_NAME }}" --production-branch main
          # --branch: main이면 프로덕션, 그 외는 미리보기. PR에서는 checkout이 merge 커밋이라 브랜치명을 직접 넘긴다.
          command: >-
            pages deploy dist
            --project-name=${{ env.PROJECT_NAME }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
            --commit-dirty=true

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$(cat <<MD
          ### 🔍 미리보기 배포됨

          | | URL |
          |---|---|
          | 브랜치 최신 | ${ALIAS_URL} |
          | 이 커밋 | ${DEPLOY_URL} |

          커밋 \`${SHA:0:7}\` · Cloudflare Pages
          MD
          )"
          # 봇 코멘트가 이미 있으면 수정, 없으면 새로 작성 (PR당 코멘트 1개 유지)
          gh pr comment "$PR_NUMBER" --body "$body" --edit-last \
            || gh pr comment "$PR_NUMBER" --body "$body"

  # HOJ(문제 은행) 배포 - 같은 레포에서 VITE_APP=hoj 로 빌드한 별도 앱 (docs 결정 8)
  #
  # 왜 Actions 로 하는가:
  #   Cloudflare 대시보드의 Git 연동(Workers Builds)은 org 에 GitHub App 설치가 필요하고, 그건 org owner 만 할 수 있다
  #   ("This action must be performed by an organization owner"). 위 Ondal 잡과 같은 이유로 여기서도 wrangler 로 직접 민다.
  #   org owner 승인을 받으면 Workers Builds 로 옮겨도 된다 - 그때 이 잡을 지우면 됨
  #
  # 커스텀 도메인(hoj.haedal-sos-man-in-the-mirror.com)은 Pages 프로젝트에 한 번만 붙이면 된다(대시보드, owner 권한 불필요)
  deploy-hoj:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # .env.hoj 를 읽는다 (VITE_APP=hoj + Ondal 과 같은 BE) → dist-hoj/
      - run: npm run build:hoj

      - name: Deploy HOJ to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          preCommands: |
            wrangler pages project list | grep -q "${{ env.HOJ_PROJECT_NAME }}" || npx wrangler pages project create "${{ env.HOJ_PROJECT_NAME }}" --production-branch main
          command: >-
            pages deploy dist-hoj
            --project-name=${{ env.HOJ_PROJECT_NAME }}
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=true
