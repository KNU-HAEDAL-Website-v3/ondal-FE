# Cloudflare Pages 배포 (Direct Upload 방식)
#
# 왜 이 방식인가:
#   Cloudflare가 레포를 읽어가는 Git 연동은 org에 GitHub App 설치(owner 승인)가 필요하다.
#   대신 이 워크플로가 빌드해서 wrangler로 Cloudflare에 밀어 넣으면 레포 시크릿 2개만으로 동작한다.
#
# 동작:
#   - main push          → 프로덕션 https://haedal-online-judge-fe.pages.dev
#   - PR(같은 레포 브랜치) → 미리보기 https://<브랜치명>.haedal-online-judge-fe.pages.dev + PR 코멘트
#
# 필요한 레포 시크릿: CLOUDFLARE_API_TOKEN (Account · Cloudflare Pages · Edit), CLOUDFLARE_ACCOUNT_ID

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write     # gitHubToken으로 GitHub Deployments 기록(PR의 "View deployment" 버튼)
  pull-requests: write   # PR에 미리보기 URL 코멘트

# 같은 브랜치에 연달아 push하면 이전 실행은 취소하고 최신만 배포
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: haedal-online-judge-fe   # Pages 프로젝트명 = URL 서브도메인 (소문자만 허용)

jobs:
  deploy:
    # fork에서 온 PR은 시크릿이 없어 배포 불가 → 건너뜀 (팀은 같은 레포 브랜치로 작업)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build   # tsc -b && vite build → dist/

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # 프로젝트가 아직 없으면 생성 (최초 1회만 실제로 실행됨)
          preCommands: |
            wrangler pages project list | grep -q "${{ env.PROJECT_NAME }}" || npx wrangler pages project create "${{ env.PROJECT_NAME }}" --production-branch main
          # --branch: main이면 프로덕션, 그 외는 미리보기. PR에서는 checkout이 merge 커밋이라 브랜치명을 직접 넘긴다.
          command: >-
            pages deploy dist
            --project-name=${{ env.PROJECT_NAME }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
            --commit-dirty=true

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$(cat <<MD
          ### 🔍 미리보기 배포됨

          | | URL |
          |---|---|
          | 브랜치 최신 | ${ALIAS_URL} |
          | 이 커밋 | ${DEPLOY_URL} |

          커밋 \`${SHA:0:7}\` · Cloudflare Pages
          MD
          )"
          # 봇 코멘트가 이미 있으면 수정, 없으면 새로 작성 (PR당 코멘트 1개 유지)
          gh pr comment "$PR_NUMBER" --body "$body" --edit-last \
            || gh pr comment "$PR_NUMBER" --body "$body"
